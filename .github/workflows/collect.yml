name: Collect Dublin Bikes data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC); GitHub may delay runs slightly
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

permissions:
  contents: write             # needed to commit the new data back to the repo

concurrency:
  group: collect              # never run two collections at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect snapshot
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}
        run: python src/collect.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --staged --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push